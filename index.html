<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="styles/indexstyle.css">
  <link rel="icon" type="image/x-icon" href="images/Twitch.jpg">
  <script src="scripts/indexscript.js" defer></script>
  <title>Stream TCG Collection Viewer</title>
</head>
<body>
  <header>
    <h1>Tom's TCG</h1>
    <p>Search your Twitch username to inspect your collection!</p>
    <div class="search-container">
      <input type="text" id="user-input" placeholder="Enter Twitch username..." />
    </div>
    <div class="leaderboard-container" id="leaderboard-box" style="display: none;">
      <span class="leaderboard-title">Top Collectors</span>
      <div class="leaderboard-chips" id="leaderboard-chips"></div>
    </div>
    <div class="stats-bar" id="stats">Your username not here? Search for yours instead!</div>
  </header>
  <main class="grid-container" id="grid"></main>
</body>
</html>
